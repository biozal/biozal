name: build profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.yml
      - generator/**
      - assets/portrait.png
      - assets/fonts/**
      - requirements.txt
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main  # build the latest main, not the (possibly stale) triggering commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m generator.build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git add README.md assets/generated
          if git diff --cached --quiet; then
            echo "profile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          # Someone may have pushed while we built; replay our regenerated files on top and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1
